name: Diabetes Preprocessing Pipeline

on:
  push:
    branches:
      - main

jobs:
  preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install pandas numpy scikit-learn

      - name: Run Preprocessing Script
        run: |
          python Preprocessing/automate_Daniel.py

      - name: Upload Processed Dataset
        uses: actions/upload-artifact@v4
        with:
          name: diabetes_preprocessed
          path: Preprocessing/diabetes_preprocessing/diabetes_preprocessed.csv